<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>위치 기능 점검</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  body { font-family: sans-serif; margin: 0; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  #map { height: 400px; border-radius: 8px; margin: 12px 0; }
  .box { background: #f3f4f6; padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; }
  .notice { background: #eef2ff; }
  button { padding: 10px 16px; font-size: 15px; border: none; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
  button:disabled { background: #9ca3af; }
  #status { font-weight: bold; }
  #log { font-family: monospace; font-size: 13px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>위치 기능 점검</h1>

<div class="box notice">
  분실물을 발견한 위치를 지도에 표시하기 위해 현재 위치를 사용합니다.
  위치는 분실물 등록에만 쓰이며, 허용하지 않아도 지도를 눌러 직접 위치를 지정할 수 있습니다.
</div>

<div class="box">
  권한 상태: <span id="permission">확인 중</span><br>
  진행 상태: <span id="status">대기</span>
</div>

<button id="locate">현재 위치 가져오기</button>

<div id="map"></div>

<div class="box">
  선택된 좌표: <span id="coords">없음</span>
</div>

<div class="box" id="log"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DEFAULT_CENTER = [37.4966, 126.9544];

const map = L.map("map").setView(DEFAULT_CENTER, 16);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

let marker = null;
let accuracyCircle = null;

const permissionEl = document.getElementById("permission");
const statusEl = document.getElementById("status");
const coordsEl = document.getElementById("coords");
const logEl = document.getElementById("log");
const locateBtn = document.getElementById("locate");

function log(msg) {
  const time = new Date().toLocaleTimeString();
  logEl.textContent = `[${time}] ${msg}\n` + logEl.textContent;
}

function setPoint(lat, lng, accuracy) {
  if (marker) {
    marker.setLatLng([lat, lng]);
  } else {
    marker = L.marker([lat, lng], { draggable: true }).addTo(map);
    marker.on("dragend", () => {
      const p = marker.getLatLng();
      if (accuracyCircle) { map.removeLayer(accuracyCircle); accuracyCircle = null; }
      updateCoords(p.lat, p.lng, null);
      log("핀을 직접 옮김");
    });
  }

  if (accuracyCircle) { map.removeLayer(accuracyCircle); accuracyCircle = null; }
  if (accuracy) {
    accuracyCircle = L.circle([lat, lng], { radius: accuracy, weight: 1, fillOpacity: 0.1 }).addTo(map);
  }

  map.setView([lat, lng], 17);
  updateCoords(lat, lng, accuracy);
}

function updateCoords(lat, lng, accuracy) {
  let text = `위도 ${lat.toFixed(6)}, 경도 ${lng.toFixed(6)}`;
  if (accuracy) text += ` (오차 약 ${Math.round(accuracy)}m)`;
  coordsEl.textContent = text;
}

async function checkPermission() {
  if (!window.isSecureContext) {
    permissionEl.textContent = "사용 불가 (HTTPS 또는 localhost 필요)";
    locateBtn.disabled = true;
    log("보안 컨텍스트가 아니라서 위치 기능을 쓸 수 없음");
    return;
  }
  if (!("geolocation" in navigator)) {
    permissionEl.textContent = "이 브라우저는 위치 기능 미지원";
    locateBtn.disabled = true;
    return;
  }
  if (!navigator.permissions) {
    permissionEl.textContent = "확인 불가 (버튼을 눌러 시도)";
    return;
  }
  try {
    const result = await navigator.permissions.query({ name: "geolocation" });
    showPermission(result.state);
    result.onchange = () => {
      showPermission(result.state);
      log(`권한 상태 변경: ${result.state}`);
    };
  } catch (e) {
    permissionEl.textContent = "확인 불가 (버튼을 눌러 시도)";
  }
}

function showPermission(state) {
  const labels = {
    granted: "허용됨",
    denied: "거부됨 (브라우저 설정에서 직접 허용해야 함)",
    prompt: "아직 묻지 않음 (버튼을 누르면 허용 창이 뜸)"
  };
  permissionEl.textContent = labels[state] || state;
}

locateBtn.addEventListener("click", () => {
  statusEl.textContent = "위치 찾는 중...";
  locateBtn.disabled = true;
  log("위치 요청 시작");

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const { latitude, longitude, accuracy } = pos.coords;
      setPoint(latitude, longitude, accuracy);
      statusEl.textContent = "성공";
      locateBtn.disabled = false;
      log(`위치 수신 성공: ${latitude}, ${longitude}, 오차 ${Math.round(accuracy)}m`);
    },
    (err) => {
      const messages = {
        1: "위치 권한이 거부됨. 지도를 눌러 직접 위치를 지정하세요.",
        2: "위치를 확인할 수 없음. 지도를 눌러 직접 위치를 지정하세요.",
        3: "위치 확인 시간 초과. 다시 시도하거나 지도를 눌러 지정하세요."
      };
      statusEl.textContent = messages[err.code] || "알 수 없는 오류";
      locateBtn.disabled = false;
      log(`실패 (code ${err.code}): ${err.message}`);
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
});

map.on("click", (e) => {
  setPoint(e.latlng.lat, e.latlng.lng, null);
  statusEl.textContent = "직접 지정함";
  log("지도를 눌러 위치 지정");
});

checkPermission();
log("페이지 로드 완료, 지도 표시됨");
</script>
</body>
</html>
