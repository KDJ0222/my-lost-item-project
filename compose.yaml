services:
  web:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      DATA_DIR: /data
      PORT: "8000"
    volumes:
      - campus-data:/data
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  campus-data:
